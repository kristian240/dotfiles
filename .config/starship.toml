format = """"""
right_format = """$git_branch $directory $cmd_duration"""

[username]
show_always = false

[directory]
style = "fg:#22aa77 bold"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[cmd_duration]
format = "[ $duration ](italic white)"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = ""
"Pictures" = ""
"propsmadness" = "pm"

[docker_context]
symbol = " "
style = " fg:#ffffff"
format = '[ $symbol $context ]($style)'

[git_branch]
symbol = ""
style = " fg:#22aa77"
format = '[$branch]($style)'
ignore_branches = ["main"]

[git_status]
style = " fg:#ffffff"
format = '[$all_status$ahead_behind ]($style)'

[profiles]
claude-code = "$claude_model$claude_context$directory"

[claude_model]
format = "[$model]($style) "
style = "fg:#22aa77"

[claude_context]
style = "bold fg:#22aa77"
format = "[$input_tokens]($style) "
gauge_width = 10

[[claude_context.display]]
threshold = 0
style = "bold fg:#22aa77"
hidden = false

[[claude_context.display]]
threshold = 30
style = "bold fg:#22aa77"

[[claude_context.display]]
threshold = 60
style = "bold fg:#22aa77"

[[claude_context.display]]
threshold = 80
style = "bold fg:#22aa77"
